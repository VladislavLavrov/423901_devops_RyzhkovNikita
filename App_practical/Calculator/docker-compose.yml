services:
 web:
  container_name: web-app-calculator-jenkins-13
  hostname: app
  build: .
  ports:
   - "0.0.0.0:5013:5013"
 prometheus:
  image: prom/prometheus:latest
  user: root
  volumes:
   - ./prometheus/config/:/etc/prometheus/
   - ./prometheus/data:/prometheus:rw
  command:
   - '--config.file=/etc/prometheus/prometheus.yml'
   - '--storage.tsdb.path=/prometheus'
  ports:
   - 9090:9090
  networks:
   - metrics-net

networks:
 metrics-net:
  name: metrics-net